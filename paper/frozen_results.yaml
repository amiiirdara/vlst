    source_file: paper_results/04_tabpfn_rating/baseline_plus_tabpfn_paper_figures_and_tables.md
    source_location: "Methods note — feature views"
    status: methods_only
  transformations:
    table4b_continuous: "Per 1 SD (population SD) in the unweighted logit."
    univariate_test_choice: "Welch if abs(skew)≤1 and excess kurtosis≤3; else Mann–Whitney U."
    source_file: paper_results/01_eda/EDA_paper_figures_and_tables.md
    source_location: "Cohort context; Table 4b caption"
    status: methods_only
  outlier_handling:

model_results:
  part4_constructors:
    source_file: .nbdump/code__modeling__rating__baseline_plus_tabpfn.txt
    source_location: "RUN_MODELS / models dict (executed Kaggle dump)"
    note: >
      Explicit constructor kwargs only. Unspecified sklearn/xgboost/lightgbm/catboost
      arguments are library defaults, not a grid. Do not import TSSI GridSearch
      winners (e.g. RF max_depth=15). Kaggle dump still constructs local TabPFN
      with balance_probabilities=True; Version 4 reports omit that flag — freeze
      the reports (false), not the stale dump line.
    kaggle_device: "Tesla T4 (CUDA True); CatBoost GPU devices=0; XGB device=cuda n_jobs=1; LGB device=gpu n_jobs=1"
    logistic_regression: 'LogisticRegression(class_weight="balanced", random_state=42, max_iter=1000)'
    random_forest: 'RandomForestClassifier(class_weight="balanced", random_state=42, n_jobs=-1)'
    xgboost: 'XGBClassifier(random_state=42, eval_metric="aucpr", tree_method="hist", device=XGB_DEVICE, n_jobs=1 if cuda else -1); per outer-train fold set_params(clf__scale_pos_weight=n_negative/n_positive)'

    source_location: "Methods note — feature views"
    status: methods_only
  transformations:
    table4b_continuous: "Per 1 SD (population SD) in the unweighted logit."
    univariate_test_choice: "Welch if abs(skew)≤1 and excess kurtosis≤3; else Mann–Whitney U."

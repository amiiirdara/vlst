preprocessing:
  imputation:
    part2_and_part4_classics: "SimpleImputer(median) on numeric; most-frequent on encoded Stent type-SES. Inert (no NaNs)."
    part5: "TabPFN-native path keeps NaNs; CSV has none."
    source_file: paper_results/04_tabpfn_rating/baseline_plus_tabpfn_paper_figures_and_tables.md
    source_location: "Methods note — feature views"
    status: methods_only
  encoding:
    stent: "Shared 9-level encoder (106 raw → 9; min_count=30)."
    part2_ohe: "OneHotEncoder drop-first → 88 columns."
    part4_ohe: "OneHotEncoder handle_unknown=ignore, no drop-first → ~89 columns, fitted inside CV splits."
    part5: "Integer categoricals; no one-hot / no scaling."
    source_file: paper_results/04_tabpfn_rating/baseline_plus_tabpfn_paper_figures_and_tables.md
    source_location: "This run (D4); methods note — feature views"
    status: methods_only
  scaling:
    part2_and_part4_classics: "StandardScaler on numeric, inside the transformer (Part 4: inside each CV split)."
